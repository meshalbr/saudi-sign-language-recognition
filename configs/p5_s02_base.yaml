# KArSL-100, leave-one-signer-out: train on two signers, test on the third (signer-independent)
data_dir: data/landmarks_v3
official_split: false
seq_len: 32
batch_size: 64
epochs: 40
lr: 0.001
weight_decay: 0.001
hidden: 128
layers: 2
dropout: 0.5
augment: true
seed: 42
out_dir: runs/p5_s02_base
features:
  hand_local: true
  velocity: true
hand_drop: 0.3
model: transformer
heads: 4
fill_gaps: 8
hand_recovery: true
min_hand_coverage: 0.6
