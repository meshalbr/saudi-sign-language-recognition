# KArSL-100, leave-one-signer-out: train on two signers, test on the third (signer-independent)
data_dir: data/landmarks
official_split: false
seq_len: 32
batch_size: 64
epochs: 40
lr: 0.002
weight_decay: 0.0001
hidden: 128
layers: 2
dropout: 0.3
augment: true
seed: 42
out_dir: runs/p2_s02_vel
features:
  velocity: true
