# Final deployment model: Transformer, phase-2 features, all three signers, official split
data_dir: data/landmarks
official_split: true
seq_len: 32
batch_size: 64
epochs: 40
lr: 0.001
weight_decay: 0.001
hidden: 128
layers: 2
dropout: 0.5
augment: true
seed: 42
out_dir: runs/final_v2
features:
  hand_local: true
  velocity: true
hand_drop: 0.3
model: transformer
heads: 4
fill_gaps: 8
