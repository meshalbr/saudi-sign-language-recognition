name: pages
# The live demo: the app as a static site where everything (MediaPipe, preprocessing, the model)
# runs in the visitor's browser. Deployed only after the JavaScript engine is checked against the
# Python code it ports.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app]"
      - name: Engine parity (JavaScript vs Python)
        run: pytest -q tests/test_engine_parity.py
      - name: Download models, trained run and reference skeletons
        run: python scripts/download_models.py
      - name: Build the static site
        run: python scripts/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
