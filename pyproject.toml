[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-recognition"
version = "0.1.0"
description = "Real-time Saudi Sign Language recognition from webcam landmarks on CPU"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Meshal AlRubaie" }]
dependencies = [
  "numpy",
  "opencv-python",
  "mediapipe",
  "torch",
  "onnx",
  "onnxruntime",
  "pyyaml",
  "tqdm",
  "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
